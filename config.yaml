# =====================================================================
#  High-frequency AI inflation-expectations survey: the whole study design
#  Change this file (and hfie/questions.py) only between, never during, a
#  study period: every wave stores a hash of it in its manifest.
# =====================================================================

study_name: hf_ai_inflation_expectations
design_version: "2026-10-18-v2"   # v2: gemini-3.5-flash-lite, one call per trial, no follow-up turn

# ---- schedule ---------------------------------------------------------
# Waves are indexed by New York clock slots. GitHub cron runs in UTC, so the
# workflow fires at both EDT and EST offsets and the runner skips a trigger
# whose slot already has a completed wave.
schedule:
  timezone: America/New_York
  slot_hours: [0, 4, 8, 12, 16, 20]

# ---- respondents ------------------------------------------------------
models:                     # exact OpenRouter slugs; never "~...-latest" aliases
  - openai/gpt-6-luna
  - openai/gpt-4o-mini
  - deepseek/deepseek-v4.1-flash-1017
  - qwen/qwen3.8-flash
  - meta-llama/llama-4-scout
  - google/gemini-3.5-flash-lite
  - anthropic/claude-haiku-5.5

trials: 3                   # independent conversations per model x persona x arm

personas:
  generic: ""
  household: "Act as the head of a household in the US."
  firm: "Act as the CEO of a US firm."
  forecaster: "You are a professional forecaster."

system_prompt: >-
  You are taking part in a survey about inflation expectations about the U.S. economy.
  Today is {date}, {hour}:00 UTC. {persona}
  Answer each question with your own best estimate; there are no right or wrong answers.
  Reply with your answer only, in exactly the format the question asks for.

# ---- information arms -------------------------------------------------
# One shared web search per topic per wave; every model in that arm gets the
# identical captured results. "none" gets no news at all.
# {date} is filled with the wave date, e.g. "October 18, 2026".
arms:
  none:          {query: null}
  general:       {query: "top news stories {date}"}
  economy:       {query: "U.S. economy inflation prices news {date}"}
  politics:      {query: "U.S. politics news {date}"}
  entertainment: {query: "entertainment news movies music celebrities {date}"}

news_intro: >-
  Here are some recent news articles, collected {collected}:

search:
  provider: openrouter_exa        # one OpenRouter call per topic with the Exa web-search server tool
  searcher_model: openai/gpt-4o-mini
  max_results: 20                 # requested; homepages/section pages are dropped ...
  keep_articles: 10               # ... and the first 10 real articles are kept
  max_excerpt_chars: 600          # per article, in the text shown to respondents
  min_results: 3                  # fewer than this -> fall back to Google News RSS
  fallback: google_news_rss

# ---- answering --------------------------------------------------------
answer_instruction: >-
  Answer each question on its own line, starting with its label, like this:

  Q1_I: <answer>

  Q2_I: <answer>

  Q3_I: <answer>

  Q4_I: <answer>

  Q5_I: <answer>

  Each probability list must contain exactly ten numbers that add up to exactly 100.

# One call per trial, no follow-up turn. A probability list whose sum misses 100 by
# more than the tolerance is rescaled proportionally to 100 (raw numbers and sum kept,
# row flagged `rescaled`); a sum outside density_rescale_range counts as invalid.
density_sum_tolerance: 0.1
density_rescale_range: [50, 150]

# ---- runtime ----------------------------------------------------------
runtime:
  max_workers: 16
  request_timeout_s: 180
  max_retries: 4
  max_wave_cost_usd: 5.0          # hard stop: no new calls once the wave has spent this much
