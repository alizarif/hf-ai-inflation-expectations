name: Website

# Builds the public site (web/ + JSON summaries of every wave) and deploys it to GitHub Pages.
# Runs after every production wave (called from survey.yml), on changes to the site code, or by hand.
# Requires Settings -> Pages -> Source: "GitHub Actions" (done).
# The same site is also published as a claude.ai page by a daily scheduled task.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "hfie/site.py", ".github/workflows/site.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main          # include the wave just committed by survey.yml
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m hfie.site --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
